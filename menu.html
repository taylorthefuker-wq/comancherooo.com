<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu — COMANCHERO</title>
<meta name="description" content="COMANCHERO menu — burgers, sandwiches, platters, pizza, grills and drinks. Maputo.">
<meta property="og:title" content="COMANCHERO — Menu">
<meta property="og:image" content="img/hero.jpg">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%23E63952'/><text x='50' y='72' font-size='62' font-family='Arial Black,Arial' font-weight='900' fill='white' text-anchor='middle'>C</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#ED2949; --red-deep:#a3162e; --gold:#c9a96a; --gold-dim:#8a7448;
    --bg:#060504; --card:#121110; --card2:#191715; --text:#f5f3ef; --muted:#9c9488; --border:#262320;
    --serif:'Playfair Display',Georgia,serif; --sans:'Manrope','Segoe UI',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;max-width:100%}
  html{scroll-behavior:smooth;scroll-padding-top:130px}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.5;overflow-x:hidden}
  ::selection{background:var(--red);color:#fff}
  a{color:inherit;text-decoration:none}
  img{display:block}
  button{font-family:inherit}

  /* TOP BAR */
  header{position:sticky;top:0;z-index:60;background:rgba(11,10,8,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
  .hrow{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 18px;flex-wrap:wrap}
  .logo{font-family:var(--serif);font-weight:800;font-size:1.15rem;letter-spacing:.02em}
  .logo a{color:var(--text)}.logo span{color:var(--gold);font-style:italic}
  .spacer{flex:1}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.45}}
  .langsw{display:flex;border:1px solid var(--border);border-radius:999px;overflow:hidden}
  .langsw button{background:none;border:none;color:var(--muted);font-size:.72rem;font-weight:800;padding:7px 13px;cursor:pointer;letter-spacing:.06em}
  .langsw button.active{background:var(--gold);color:#0b0a08}

  /* SEARCH + TOOLS */
  .tools{max-width:1100px;margin:14px auto 0;padding:0 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .search{flex:1;min-width:200px;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:999px;padding:11px 18px}
  .search input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:.92rem;font-family:inherit}
  .search svg{opacity:.45;flex:none}
  .viewsw{display:flex;border:1px solid var(--border);border-radius:999px;overflow:hidden}
  .viewsw button{background:none;border:none;color:var(--muted);padding:9px 16px;font-size:.78rem;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:6px}
  .viewsw button.active{background:var(--red);color:#fff}

  /* MENU CHIPS */
  .chips{max-width:1100px;margin:12px auto 0;padding:0 18px 14px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;background:var(--card);border:1px solid var(--border);border-radius:999px;color:var(--muted);font-weight:800;font-size:.8rem;padding:9px 16px;cursor:pointer;white-space:nowrap;transition:all .18s}
  .chip:hover{border-color:var(--gold);color:var(--gold)}
  .chip.active{background:var(--gold);border-color:var(--gold);color:#0b0a08}

  .wrap{max-width:1100px;margin:0 auto;padding:26px 18px 40px}

  .menu-title{font-family:var(--serif);font-weight:800;font-size:2rem;text-align:center;margin:8px 0 4px}
  .menu-sub{text-align:center;color:var(--muted);font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;margin-bottom:24px}

  .sec-head{margin:38px 0 16px;display:flex;align-items:center;gap:14px}
  .sec-head h3{font-family:var(--serif);font-size:1.15rem;font-weight:800;color:var(--gold);white-space:nowrap}
  .sec-head .line{flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}
  .sec-head .count{font-size:.7rem;color:var(--muted);letter-spacing:.12em}

  /* GRID VIEW */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
  .item{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:transform .2s,border-color .2s,box-shadow .2s}
  .item:hover{transform:translateY(-4px);border-color:var(--gold-dim);box-shadow:0 14px 34px rgba(0,0,0,.5)}
  .item .ph{aspect-ratio:4/3;background:var(--card2);overflow:hidden;position:relative}
  .item .ph img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
  .item:hover .ph img{transform:scale(1.06)}
  .item .noimg{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:2.4rem;color:#3a332a}
  .item .body{padding:9px 15px 15px}
  .item .row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .item h4{font-size:.95rem;font-weight:800;line-height:1.3}
  .price{color:var(--gold);font-weight:800;font-size:.9rem;white-space:nowrap}
  .price small{font-size:.62em;opacity:.75;margin-right:3px}
  .item .desc{color:var(--muted);font-size:.84rem;line-height:1.55;margin:0;max-height:0;opacity:0;overflow:hidden;transform:translateY(-6px);transition:max-height .35s ease,opacity .3s ease,margin .3s ease,transform .35s ease}
  .item.exp .desc{max-height:260px;opacity:1;margin-top:8px;transform:none}
  .item.exp{border-color:rgba(230,178,103,.4);box-shadow:0 14px 34px rgba(0,0,0,.45)}
  .item .row{cursor:pointer}
  .item .p-under{display:flex;justify-content:center;padding:12px 15px 0}
  .item .p-under .price{font-size:1rem}
  .item .p-under:empty{display:none}
  .item .chev{width:14px;height:14px;color:var(--muted);transition:transform .3s;flex:none}
  .item.exp .chev{transform:rotate(180deg);color:var(--gold)}

  /* REELS VIEW */
  .reels{display:none;flex-direction:column;gap:22px}
  body.view-reels .grid{display:none}
  body.view-reels .reels{display:flex}
  .reel{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--border);background:var(--card);scroll-snap-align:center}
  .reel .rph{aspect-ratio:16/10;overflow:hidden;position:relative}
  .reel .rph img{width:100%;height:100%;object-fit:cover}
  .reel .noimg{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:3rem;color:#3a332a}
  .reel .rdet{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px}
  .reel .rtop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .reel .rsec{font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:800;margin-bottom:4px}
  .reel h4{font-family:var(--serif);font-size:1.25rem;font-weight:800;line-height:1.2}
  .reel .desc{color:var(--muted);font-size:.85rem;margin:0;display:block}
  .reel .price{font-size:1.05rem}
  .reel .price-row .add-btn{position:static}

  .empty-note{color:var(--muted);text-align:center;padding:40px 10px;font-size:.9rem}
  .noresults{display:none;text-align:center;padding:60px 20px;color:var(--muted)}
  .noresults b{color:var(--text);font-size:1.05rem;display:block;margin-bottom:8px}

  /* INSTA WALL */
  .insta{margin-top:50px;border-top:1px solid var(--border);padding-top:34px}
  .insta-head{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:18px;color:var(--muted);font-weight:800;font-size:.8rem;letter-spacing:.16em;text-transform:uppercase}
  .insta-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .ig{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--border)}
  .ig img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
  .ig:hover img{transform:scale(1.08)}
  .ig .heart{position:absolute;top:8px;right:8px;background:rgba(11,10,8,.75);backdrop-filter:blur(4px);border-radius:999px;padding:4px 9px;font-size:.68rem;font-weight:700;display:flex;gap:5px;align-items:center}


  footer{border-top:1px solid var(--border);padding:30px 20px 46px;text-align:center;color:#5c554a;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase}
  footer a{color:var(--gold)}


  .chip.active{box-shadow:0 0 0 1px var(--gold),0 8px 20px rgba(201,169,106,.18)}
  .item .body{position:relative}
  .add-btn{position:absolute;bottom:10px;right:10px;width:38px;height:38px;border-radius:50%;background:var(--red);color:#fff;border:none;font-size:1.15rem;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 18px rgba(237,41,73,.45);transition:transform .18s,background .18s}
  .add-btn:hover{transform:scale(1.12)}
  .add-btn.added{background:#3ddc84}
  .reel .price-row{display:flex;align-items:center;gap:8px}

  /* CART FAB */

  .iacts{position:absolute;bottom:10px;left:10px;display:flex;gap:8px;z-index:2}
  .icon-btn{width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.62);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.18);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s,color .15s,border-color .15s;padding:0}
  .icon-btn:hover{transform:scale(1.1)}
  .icon-btn svg{width:15px;height:15px}
  .icon-btn.liked{color:#ff4d6d;border-color:rgba(255,77,109,.55)}
  .icon-btn.liked svg path{fill:#ff4d6d;stroke:#ff4d6d}
  .reel .price-row{margin-left:auto}
  .reel .price-row .icon-btn{position:static;background:var(--card2);border-color:var(--border)}
  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(8px);background:var(--card2);border:1px solid var(--border);color:var(--text);font-size:.82rem;font-weight:700;padding:11px 18px;border-radius:999px;z-index:120;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .cart-fab{position:fixed;bottom:22px;right:22px;z-index:85}
  .cart-fab .fab{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,var(--red),#8e1b2b);border:1px solid rgba(255,255,255,.14);color:#fff;cursor:pointer;box-shadow:0 12px 30px rgba(237,41,73,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .2s}
  .cart-fab .fab:hover{transform:scale(1.08)}
  .cart-fab .fab .lbl{font:800 8.5px/1 'Manrope','Segoe UI',system-ui;letter-spacing:.12em;text-transform:uppercase;opacity:.9}
  .cart-fab .badge{position:absolute;top:-4px;right:-4px;background:#fff;color:var(--red);font:900 .7rem/1 'Manrope',system-ui;border-radius:999px;min-width:20px;padding:5px 6px;display:none;box-shadow:0 4px 12px rgba(0,0,0,.4)}
  .cart-fab .badge.show{display:block}
  .cart-fab .badge.bump{animation:bump .3s}
  @keyframes bump{50%{transform:scale(1.35)}}
  .cart-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:95;display:none;align-items:flex-end;justify-content:center}
  .cart-overlay.open{display:flex}
  .cart-sheet{background:var(--card);border:1px solid var(--border);border-radius:20px 20px 0 0;width:100%;max-width:520px;max-height:82vh;overflow:auto;padding:22px 20px 26px;animation:slideUp .25s ease}
  @keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
  .cart-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .cart-head h3{font-family:var(--serif);font-size:1.25rem}
  .cart-close{background:none;border:none;color:var(--muted);font-size:1.3rem;cursor:pointer;line-height:1}
  .cart-empty{color:var(--muted);text-align:center;padding:40px 10px;font-size:.9rem}
  .cart-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
  .cart-row img{width:52px;height:52px;border-radius:10px;object-fit:cover;flex:none;background:var(--card2)}
  .cart-row .noimg{width:52px;height:52px;border-radius:10px;background:var(--card2);display:flex;align-items:center;justify-content:center;color:#3a332a;font-family:var(--serif);flex:none}
  .cart-row .ci{flex:1;min-width:0}
  .cart-row .ci h5{font-size:.88rem;font-weight:700}
  .cart-row .ci .up{color:var(--muted);font-size:.72rem}
  .cart-row .qty{display:flex;align-items:center;gap:8px}
  .cart-row .qty button{width:26px;height:26px;border-radius:50%;border:1px solid var(--border);background:none;color:var(--text);font-size:.9rem;cursor:pointer}
  .cart-row .qty span{min-width:16px;text-align:center;font-weight:700;font-size:.85rem}
  .cart-row .lt{color:var(--gold);font-weight:800;font-size:.85rem;white-space:nowrap;min-width:64px;text-align:right}
  .cart-row .rm{color:var(--muted);background:none;border:none;font-size:.9rem;cursor:pointer;padding:4px}
  .cart-total{display:flex;justify-content:space-between;align-items:baseline;margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}
  .cart-total .lbl{color:var(--muted);font-size:.85rem;text-transform:uppercase;letter-spacing:.1em}
  .cart-total .val{color:var(--gold);font-family:var(--serif);font-size:1.5rem;font-weight:800}
  .cart-actions{display:flex;gap:10px;margin-top:18px}
  .cart-actions .btn{flex:1;padding:13px 16px;border-radius:999px;font-weight:800;font-size:.85rem;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
  .cart-actions .share{background:#25D366;color:#04150a;border:none}
  .cart-actions .clear{background:none;color:var(--muted)}

  .reveal{opacity:0;transform:translateY(16px);transition:opacity .6s,transform .6s}
  .reveal.in{opacity:1;transform:none}
  @media(max-width:640px){
    .grid{grid-template-columns:1fr 1fr;gap:10px}
    .item h4{font-size:.85rem}.item .desc{font-size:.72rem}
    .menu-title{font-size:1.5rem}
  }
</style>
</head>
<body class="view-grid">

<header>
  <div class="tools">
    <label class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" placeholder="Procurar no menu…" oninput="doSearch(this.value)">
    </label>
    <div class="langsw"><button id="btn-pt" class="active" onclick="setLang('pt')">PT</button><button id="btn-en" onclick="setLang('en')">EN</button></div>
    <div class="viewsw">
      <button id="vw-grid" class="active" onclick="setView('grid')">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        <span data-i18n="grid">Grelha</span></button>
      <button id="vw-reels" onclick="setView('reels')">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="4" width="18" height="15" rx="3"/><path d="M10 9l5 3-5 3z" fill="#0b0a08"/></svg>
        <span data-i18n="reels">Reels</span></button>
    </div>
  </div>
  <div class="chips" id="chips"></div>
</header>

<div class="wrap">
  <h2 class="menu-title" id="mt">O Menu</h2>
  <div class="menu-sub" id="ms">Tudo feito na hora</div>
  <div id="content"></div>

  <div class="noresults" id="noresults"><b data-i18n="noRes">Nada encontrado</b><span data-i18n="noResSub">Tenta outra palavra…</span></div>

  <section class="insta">
    <div class="insta-head">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
      <a href="https://instagram.com/comanxero" target="_blank" rel="noopener">@comanxero</a>
    </div>
    <div class="insta-grid" id="igwall"></div>
  </section>
</div>

<div class="cart-fab">
  <button class="fab" onclick="openCart()" aria-label="basket">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
    <span class="lbl" data-i18n="cartBtn">Pedido</span>
  </button>
  <span class="badge" id="cart-n">0</span>
</div>
<div class="cart-overlay" id="cart-overlay" onclick="if(event.target===this)closeCart()">
  <div class="cart-sheet">
    <div class="cart-head"><h3 data-i18n="cartTitle">O meu pedido</h3><button class="cart-close" onclick="closeCart()">&times;</button></div>
    <div id="cart-body"></div>
  </div>
</div>

<footer>© COMANCHERO · <a href="/">comancherooo.com</a></footer>

<script>
/* ---- HOURS (edit here: 0=Sun … 6=Sat, [open, close] Maputo time) ---- */
const HOURS = {0:[10,23],1:[10,23],2:[10,23],3:[10,23],4:[10,23],5:[10,23],6:[10,23]};

const I18N = {
  pt:{search:'Procurar no menu…', grid:'Grelha', reels:'Reels', open:'Aberto agora', closed:'Fechado agora',
      menuTitle:'O Menu', menuSub:'Tudo feito na hora', items:'itens', noRes:'Nada encontrado', noResSub:'Tenta outra palavra…',
      aiTitle:'Precisas de ajuda?', aiSub:'Fala connosco — respondemos rápido no WhatsApp.',
      aiWa:'Pedir no WhatsApp', aiHours:'Ver horário',
      cartTitle:'O meu pedido', cartEmpty:'O teu cesto está vazio', cartTotal:'Total', cartShare:'Partilhar no WhatsApp', cartClear:'Limpar', cartBtn:'Pedido', liked:'Gostaste! Obrigado'},
  en:{search:'Search the menu…', grid:'Grid', reels:'Reels', open:'Open now', closed:'Closed now',
      menuTitle:'The Menu', menuSub:'Freshly made to order', items:'items', noRes:'Nothing found', noResSub:'Try another word…',
      aiTitle:'Need a hand?', aiSub:'Talk to us — we reply fast on WhatsApp.',
      aiWa:'Order on WhatsApp', aiHours:'See hours',
      cartTitle:'My order', cartEmpty:'Your cart is empty', cartTotal:'Total', cartShare:'Share on WhatsApp', cartClear:'Clear', cartBtn:'Order'}
};
let LANG = localStorage.getItem('cmx_lang') || 'pt';
let DATA = null, VIEW = 'grid';
let ITEM_INDEX = {};
let CART = JSON.parse(localStorage.getItem('cmx_cart')||'{}');
let LIKES = JSON.parse(localStorage.getItem('cmx_likes')||'{}');
let SUPPRESS_SPY = false;
let __supTO = null;
let spyObserver = null;

const fmtPrice = p => String(p||'').replace(/\.00$/,'');
const esc = s => String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

fetch('data.json?v=' + Date.now()).then(r=>r.json()).then(d=>{ DATA = d; build(); });

function build(){
  ITEM_INDEX = {};
  DATA.menus.forEach((menu,mi)=>menu.sections.forEach((sec,si)=>sec.items.forEach((it,ii)=>{
    ITEM_INDEX[itemKey(mi,si,ii)] = it;
  })));

  const chips = document.getElementById('chips');
  chips.innerHTML = '';
  DATA.menus.forEach((m,i)=>{
    const b = document.createElement('button');
    b.className = 'chip' + (i===0?' active':'');
    b.textContent = m.name;
    b.dataset.mi = i;
    b.onclick = ()=>{
      SUPPRESS_SPY = true;
      document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      const t = document.querySelector('.sec-head[data-mi="'+i+'"]') || document.getElementById('chips');
      const y = t.getBoundingClientRect().top + window.scrollY - 132;
      window.scrollTo({top:y, behavior:'smooth'});
      clearTimeout(__supTO);
      __supTO = setTimeout(()=>{ SUPPRESS_SPY = false; }, 1000);
      if('onscrollend' in window){ window.addEventListener('scrollend', ()=>{ SUPPRESS_SPY = false; clearTimeout(__supTO); }, {once:true}); }
    };
    chips.appendChild(b);
  });
  render();
  buildInstaWall();
  applyLang();
  renderCartUI();
  requestAnimationFrame(observeSections);
  const h = location.hash;
  if(h && h.startsWith('#it-')){
    const el = document.getElementById(h.slice(1));
    if(el) setTimeout(()=>{ const y = el.getBoundingClientRect().top + window.scrollY - 132; window.scrollTo({top:y}); }, 120);
  }
}

function itemKey(mi,si,ii){ return mi+'-'+si+'-'+ii; }

function render(q){
  q = (q||'').trim().toLowerCase();
  let html = '';
  DATA.menus.forEach((menu, mi)=>{
    let si = -1;
    const secs = menu.sections.map(sec=>{ si++;
      const items = sec.items.map((it,ii)=>({it,ii})).filter(({it})=>{
        if(!q) return true;
        return (it.name+' '+(it.desc||'')).toLowerCase().includes(q);
      });
      if(!items.length) return '';
      return `<div class="sec-head" id="sec-${mi}-${si}" data-mi="${mi}"><h3>${esc(sec.name)}</h3><div class="line"></div><span class="count">${items.length} ${I18N[LANG].items}</span></div>` +
        `<div class="grid" data-mi="${mi}">` + items.map(({it,ii})=>{
          const key = itemKey(mi,si,ii);
          const img = it.img ? `<img src="${esc(it.img)}" alt="${esc(it.name)}" loading="lazy">` : `<div class="noimg">C</div>`;
          const price = it.price ? `<span class="price"><small>MT</small>${fmtPrice(it.price)}</span>` : '';
          const desc = it.desc ? `<p class="desc">${esc(it.desc)}</p>` : '';
          const chev = it.desc ? `<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>` : '';
          return `<article class="item" id="it-${key}"${it.desc?` onclick="toggleExpand('${key}',event)"`:''}><div class="ph">${img}<div class="iacts"><button class="icon-btn ${LIKES[key]?'liked':''}" data-like="${key}" onclick="toggleLike('${key}')" aria-label="like"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg></button><button class="icon-btn" onclick="shareItem('${key}')" aria-label="share"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13"/><path d="M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></button></div><button class="add-btn" data-key="${key}" onclick="addToCart('${key}',this)" aria-label="add">+</button></div><div class="p-under">${price}</div><div class="body"><div class="row"><h4>${esc(it.name)}</h4>${chev}</div>${desc}</div></article>`;
        }).join('') + `</div>` +
        `<div class="reels" data-mi="${mi}">` + items.map(({it,ii})=>{
          const key = itemKey(mi,si,ii);
          const img = it.img ? `<img src="${esc(it.img)}" alt="${esc(it.name)}" loading="lazy">` : `<div class="noimg">C</div>`;
          const price = it.price ? `<span class="price"><small>MT</small>${fmtPrice(it.price)}</span>` : '';
          const desc = it.desc ? `<p class="desc">${esc(it.desc)}</p>` : '';
          return `<div class="reel" id="it-${key}"><div class="rph">${img}</div><div class="rdet"><div class="rtop"><div><div class="rsec">${esc(sec.name)}</div><h4>${esc(it.name)}</h4></div><div class="price-row">${price}<button class="icon-btn ${LIKES[key]?'liked':''}" data-like="${key}" onclick="toggleLike('${key}')" aria-label="like"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg></button><button class="icon-btn" onclick="shareItem('${key}')" aria-label="share"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13"/><path d="M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></button><button class="add-btn" data-key="${key}" onclick="addToCart('${key}',this)" aria-label="add">+</button></div></div>${desc}</div></div>`;
        }).join('') + `</div>`;
    }).join('');
    if(secs) html += secs;
  });
  document.getElementById('content').innerHTML = html || '';
  document.getElementById('noresults').style.display = (html && !q) || html ? 'none' : 'block';
  observeReveals();
}

function doSearch(v){ render(v); requestAnimationFrame(observeSections); }

function buildInstaWall(){
  // 6 recent photos straight from the menu, linking to the Instagram profile
  const pool = [];
  DATA.menus.forEach(m=>m.sections.forEach(s=>s.items.forEach(it=>{ if(it.img) pool.push(it); })));
  const picks = pool.filter((_,i)=>i%9===0).slice(0,6);
  const hearts = ['❤ 1.2k','❤ 847','❤ 632','❤ 521','❤ 498','❤ 377'];
  document.getElementById('igwall').innerHTML = picks.map((it,i)=>
    `<a class="ig" href="https://instagram.com/comanxero" target="_blank" rel="noopener"><img src="${esc(it.img)}" alt="${esc(it.name)}" loading="lazy"><span class="heart">${hearts[i%hearts.length]}</span></a>`).join('');
}

function setView(v){
  VIEW = v;
  document.body.className = 'view-'+v;
  document.getElementById('vw-grid').classList.toggle('active', v==='grid');
  document.getElementById('vw-reels').classList.toggle('active', v==='reels');
  localStorage.setItem('cmx_view', v);
}
function setLang(l){
  LANG = l; localStorage.setItem('cmx_lang', l);
  document.getElementById('btn-pt').classList.toggle('active', l==='pt');
  document.getElementById('btn-en').classList.toggle('active', l==='en');
  applyLang();
  if(DATA){ render(document.getElementById('q').value); renderCartUI(); requestAnimationFrame(observeSections); }
}
function applyLang(){
  const t = I18N[LANG];
  document.documentElement.lang = LANG;
  document.getElementById('q').placeholder = t.search;
  document.getElementById('mt').textContent = t.menuTitle;
  document.getElementById('ms').textContent = t.menuSub;
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = t[el.dataset.i18n] || el.textContent; });
}
let io;
function observeReveals(){
  io = io || new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target);} }),{threshold:.06});
  document.querySelectorAll('.reveal:not(.in)').forEach(el=>io.observe(el));
}
const savedView = localStorage.getItem('cmx_view'); if(savedView) setView(savedView);

/* ---------------- SCROLL-SPY ---------------- */
function observeSections(){
  if(spyObserver) spyObserver.disconnect();
  const heads = document.querySelectorAll('.sec-head');
  if(!heads.length) return;
  spyObserver = new IntersectionObserver((entries)=>{
    if(SUPPRESS_SPY) return;
    // pick the entry closest to top among those intersecting the "active band"
    let best = null, bestTop = Infinity;
    entries.forEach(e=>{
      if(e.isIntersecting){
        const top = Math.abs(e.boundingClientRect.top - 120);
        if(top < bestTop){ bestTop = top; best = e.target; }
      }
    });
    if(best){
      const mi = best.dataset.mi;
      document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active', c.dataset.mi===mi));
      const activeChip = document.querySelector('.chip[data-mi="'+mi+'"]');
      const cbox = document.getElementById('chips');
      const tx = activeChip.offsetLeft - cbox.clientWidth/2 + activeChip.offsetWidth/2;
      cbox.scrollTo({left: tx, behavior: 'smooth'});
    }
  }, { rootMargin: '-110px 0px -70% 0px', threshold: 0 });
  heads.forEach(h=>spyObserver.observe(h));
}
window.addEventListener('scroll', ()=>{}, {passive:true}); // keep listener footprint minimal; IO handles the work

/* ---------------- CART ---------------- */
function saveCart(){ localStorage.setItem('cmx_cart', JSON.stringify(CART)); }
function addToCart(key, btn){
  CART[key] = (CART[key]||0) + 1;
  saveCart(); renderCartUI();
  if(btn){ btn.classList.add('added'); btn.textContent = '✓'; setTimeout(()=>{ btn.classList.remove('added'); btn.textContent = '+'; }, 700); }
}
function changeQty(key, delta){
  CART[key] = (CART[key]||0) + delta;
  if(CART[key] <= 0) delete CART[key];
  saveCart(); renderCartUI();
}
function removeFromCart(key){ delete CART[key]; saveCart(); renderCartUI(); }
function clearCart(){ CART = {}; saveCart(); renderCartUI(); }
function cartTotal(){
  return Object.entries(CART).reduce((sum,[key,qty])=>{
    const it = ITEM_INDEX[key]; if(!it) return sum;
    return sum + (parseFloat(it.price)||0) * qty;
  }, 0);
}
function cartCount(){ return Object.values(CART).reduce((a,b)=>a+b,0); }
function renderCartUI(){
  const n = cartCount();
  const badge = document.getElementById('cart-n');
  badge.textContent = n;
  const wasHidden = !badge.classList.contains('show');
  badge.classList.toggle('show', n > 0);
  if(n > 0 && wasHidden){ badge.classList.add('bump'); setTimeout(()=>badge.classList.remove('bump'), 350); }
  const body = document.getElementById('cart-body');
  const t = I18N[LANG];
  const keys = Object.keys(CART);
  if(!keys.length){
    body.innerHTML = `<div class="cart-empty">${t.cartEmpty}</div>`;
    return;
  }
  let rows = '';
  keys.forEach(key=>{
    const it = ITEM_INDEX[key]; if(!it) return;
    const qty = CART[key];
    const price = parseFloat(it.price)||0;
    const img = it.img ? `<img src="${esc(it.img)}" alt="${esc(it.name)}">` : `<div class="noimg">C</div>`;
    rows += `<div class="cart-row">${img}<div class="ci"><h5>${esc(it.name)}</h5><div class="up">${fmtPrice(it.price)} MT</div></div>
      <div class="qty"><button onclick="changeQty('${key}',-1)">−</button><span>${qty}</span><button onclick="changeQty('${key}',1)">+</button></div>
      <div class="lt">${fmtPrice((price*qty).toFixed(2))} MT</div>
      <button class="rm" onclick="removeFromCart('${key}')" aria-label="remove">✕</button></div>`;
  });
  const total = cartTotal();
  body.innerHTML = rows +
    `<div class="cart-total"><span class="lbl">${t.cartTotal}</span><span class="val">${fmtPrice(total.toFixed(2))} MT</span></div>
     <div class="cart-actions">
       <button class="btn clear" onclick="clearCart()">${t.cartClear}</button>
       <button class="btn share" onclick="shareCart()">📲 ${t.cartShare}</button>
     </div>`;
}
function shareCart(){
  const lines = Object.keys(CART).map(key=>{
    const it = ITEM_INDEX[key]; if(!it) return null;
    return `${CART[key]}x ${it.name} — ${fmtPrice(it.price)} MT`;
  }).filter(Boolean);
  if(!lines.length) return;
  const total = cartTotal();
  const msg = `Olá! Gostaria de pedir:\n\n${lines.join('\n')}\n\nTotal: ${fmtPrice(total.toFixed(2))} MT`;
  window.open('https://wa.me/258878473337?text=' + encodeURIComponent(msg), '_blank');
}
function toggleExpand(key, ev){
  if(ev && ev.target.closest('button')) return;
  const el = document.getElementById('it-' + key);
  if(!el || !el.querySelector('.desc')) return;
  el.classList.toggle('exp');
}
function openCart(){ document.getElementById('cart-overlay').classList.add('open'); }
function closeCart(){ document.getElementById('cart-overlay').classList.remove('open'); }

/* ---------------- LIKES + SHARE ---------------- */
const SHARE_BASE = 'https://comancherooo.com/menu';
const DEFAULT_LIKE_URL = 'https://www.instagram.com/comanxero/';
function likeUrl(){ return (DATA && DATA.social && DATA.social.like_url) || DEFAULT_LIKE_URL; }
function toggleLike(key){
  if(!LIKES[key]){ LIKES[key] = 1; window.open(likeUrl(), '_blank'); }
  else delete LIKES[key];
  localStorage.setItem('cmx_likes', JSON.stringify(LIKES));
  document.querySelectorAll('[data-like="'+key+'"]').forEach(b=>b.classList.toggle('liked', !!LIKES[key]));
  if(LIKES[key]) toast('❤️ ' + I18N[LANG].liked);
}
function shareItem(key){
  const it = ITEM_INDEX[key]; if(!it) return;
  const url = SHARE_BASE + '#it-' + key;
  const text = it.name + (it.price ? ' — ' + fmtPrice(it.price) + ' MT' : '') + ' · COMANCHERO';
  if(navigator.share){ navigator.share({title: it.name, text: text, url: url}).catch(()=>{}); }
  else { window.open('https://wa.me/?text=' + encodeURIComponent(text + ' ' + url), '_blank'); }
}
function toast(msg){
  let t = document.getElementById('cmx-toast');
  if(!t){ t = document.createElement('div'); t.className='toast'; t.id='cmx-toast'; document.body.appendChild(t); }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._to);
  t._to = setTimeout(()=>t.classList.remove('show'), 2200);
}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COMANCHERO — American Fastfood Restaurant & Grill House</title>
<meta name="description" content="COMANCHERO — burgers, grills, pizza and more. Maputo Shopping Center.">
<meta property="og:title" content="COMANCHERO">
<meta property="og:description" content="American Fastfood Restaurant & Grill House">
<meta property="og:image" content="img/hero.jpg">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%23E63952'/><text x='50' y='72' font-size='62' font-family='Arial Black,Arial' font-weight='900' fill='white' text-anchor='middle'>C</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#ED2949; --red-deep:#a3162e; --gold:#f5f3ef; --gold-dim:#f5f3ef;
    --bg:#060504; --card:#121110; --card2:#191715; --text:#f5f3ef; --muted:#9c9488; --border:#262320;
    --serif:'Playfair Display',Georgia,serif; --sans:'Manrope','Segoe UI',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;max-width:100%}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.5;overflow-x:hidden}
  ::selection{background:var(--red);color:#fff}
  a{color:inherit;text-decoration:none}
  img{display:block}

  /* HERO */
  .hero{position:relative;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:26px 20px;overflow:hidden}
  .hero::before{content:'';position:absolute;inset:0;background:
    radial-gradient(ellipse 70% 50% at 50% 18%, rgba(201,169,106,.14), transparent 70%),
    radial-gradient(ellipse 90% 60% at 50% 110%, rgba(230,57,82,.12), transparent 70%);
    pointer-events:none}
  .glow-ring{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);width:min(84vw,560px);aspect-ratio:1;border-radius:50%;border:1px solid rgba(201,169,106,.16);pointer-events:none;animation:pulse 6s ease-in-out infinite}
  .glow-ring::after{content:'';position:absolute;inset:34px;border-radius:50%;border:1px solid rgba(230,57,82,.14)}
  @keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.045)}}

  .open-pill{position:relative;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);background:rgba(21,19,16,.7);backdrop-filter:blur(6px);border-radius:999px;padding:8px 16px;font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .open-pill .dot{width:8px;height:8px;border-radius:50%;background:#3ddc84;box-shadow:0 0 10px #3ddc84;animation:blink 2.2s infinite}
  .open-pill.closed .dot{background:var(--red);box-shadow:0 0 10px var(--red)}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.45}}

  .hero h1{position:relative;font-family:var(--serif);font-weight:800;font-size:clamp(2.1rem,9vw,4.2rem);letter-spacing:.01em;margin-top:26px;line-height:1.05}
  .hero h1 .accent{color:var(--red);font-style:italic}
  .hero .tag{margin-top:14px;color:var(--muted);font-size:clamp(.9rem,2.8vw,1.1rem);letter-spacing:.22em;text-transform:uppercase;font-weight:600}
  .hero .divider{margin:26px auto 0;width:120px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}

  .follow-row{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap;justify-content:center}
  .follow-btn{display:inline-flex;align-items:center;gap:9px;padding:11px 20px;border:1px solid var(--border);border-radius:999px;color:var(--text);font-weight:700;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;background:rgba(255,255,255,.03);transition:transform .2s,border-color .2s,background .2s,color .2s}
  .follow-btn:hover{transform:translateY(-2px)}
  .follow-btn.ig:hover{border-color:var(--red);background:rgba(230,57,82,.12)}
  .follow-btn.fb:hover{border-color:var(--red);background:rgba(230,57,82,.12)}
  .follow-btn svg{width:15px;height:15px;color:var(--red)}
  .cta-row{position:relative;display:flex;gap:12px;margin-top:38px;flex-wrap:wrap;justify-content:center}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:15px 30px;border-radius:999px;font-weight:800;font-size:.92rem;letter-spacing:.06em;text-transform:uppercase;border:1px solid transparent;cursor:pointer;transition:transform .18s,box-shadow .18s,background .18s,border-color .18s}
  .btn:active{transform:scale(.97)}
  .btn-primary{background:var(--red);color:#fff;box-shadow:0 10px 30px rgba(230,57,82,.28)}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(230,57,82,.4)}
  .btn-ghost{border-color:var(--border);color:var(--text);background:rgba(21,19,16,.5);backdrop-filter:blur(6px)}
  .btn-ghost:hover{border-color:var(--gold);color:var(--gold);transform:translateY(-2px)}
  .btn .arrow{transition:transform .18s}
  .btn:hover .arrow{transform:translateX(4px)}

  /* INFO STRIP */
  .strip{border-top:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--card)}
  .strip-inner{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border)}
  .cell{background:var(--card);padding:26px 18px;text-align:center;transition:background .2s}
  .cell:hover{background:var(--card2)}
  .cell .ic{font-size:1.3rem;margin-bottom:8px}
  .cell .l1{font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:800}
  .cell .l2{font-size:.88rem;color:var(--muted);margin-top:4px}

  /* FOOTER */
  footer{padding:44px 20px 60px;text-align:center}
  .socials{display:flex;gap:14px;justify-content:center;margin-bottom:22px}
  .soc{width:42px;height:42px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--muted);transition:all .2s}
  .soc:hover{border-color:var(--red);color:#fff;transform:translateY(-3px);background:rgba(230,57,82,.12)}
  .fine{color:#5c554a;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase}

  .fade-up{opacity:0;transform:translateY(18px);animation:fadeUp .9s ease forwards}
  .d1{animation-delay:.1s}.d2{animation-delay:.25s}.d3{animation-delay:.4s}.d4{animation-delay:.55s}
  @keyframes fadeUp{to{opacity:1;transform:none}}
  @media(max-width:640px){ .strip-inner{grid-template-columns:1fr} .cell{padding:20px} }
</style>
</head>
<body>

<section class="hero" id="top">
  <div class="glow-ring"></div>
  <div class="open-pill fade-up" id="open-pill"><span class="dot"></span><span id="open-label">…</span></div>
  <h1 class="fade-up d1">COMAN<span class="accent">CHERO</span></h1>
  <div class="tag fade-up d2" id="tagline">American Fastfood Restaurant & Grill House</div>
  <div class="divider fade-up d2"></div>
  <div class="follow-row fade-up d3">
    <a class="follow-btn ig" href="https://instagram.com/comanxero" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
      <span data-i18n="followIg">Siga-nos no Instagram</span>
    </a>
    <a class="follow-btn fb" href="https://facebook.com/comanxeroo" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 8h3V5h-3c-2.2 0-4 1.8-4 4v2H7v3h3v7h3v-7h3l1-3h-4V9c0-.6.4-1 1-1z"/></svg>
      <span data-i18n="followFb">Facebook</span>
    </a>
  </div>
  <div class="cta-row fade-up d3">
    <a class="btn btn-primary" href="/menu" id="cta-menu">Ver Menu <span class="arrow">→</span></a>
    <a class="btn btn-ghost" href="https://wa.me/258878473337" target="_blank" rel="noopener" id="cta-wa">WhatsApp</a>
  </div>
</section>

<div class="strip fade-up d4">
  <div class="strip-inner">
    <div class="cell"><div class="l1" data-i18n="visit">Visite-nos</div><div class="l2" id="loc">Maputo Shopping Center</div></div>
    <div class="cell"><div class="l1" data-i18n="hours">Horário</div><div class="l2" id="hours">10:00 – 23:00</div></div>
    <div class="cell"><div class="l1" data-i18n="order">Pedidos</div><div class="l2" data-i18n="orderSub">Peça pelo WhatsApp ou no balcão</div></div>
  </div>
</div>

<footer>
  <div class="socials">
    <a class="soc" href="https://instagram.com/comanxero" target="_blank" rel="noopener" aria-label="Instagram">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
    </a>
    <a class="soc" href="https://facebook.com/comanxeroo" target="_blank" rel="noopener" aria-label="Facebook">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M14 8h3V5h-3c-2.2 0-4 1.8-4 4v2H7v3h3v7h3v-7h3l1-3h-4V9c0-.6.4-1 1-1z"/></svg>
    </a>
    <a class="soc" href="https://wa.me/258878473337" target="_blank" rel="noopener" aria-label="WhatsApp">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.2 1.2-1.7 1.2-.5.1-1 .1-1.7-.1-.4-.1-.9-.3-1.6-.6-2.8-1.2-4.7-4-4.8-4.2-.1-.2-1.2-1.5-1.2-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5s.7 1.8.8 1.9c.1.1.1.3 0 .5-.1.2-.1.3-.3.5l-.4.5c-.1.1-.3.3-.1.6.2.3.9 1.4 1.9 2.3 1.3 1.1 2.4 1.5 2.7 1.6.3.1.5.1.7-.1.2-.2.8-1 .1-1.1-.6-.2 0-.4.1-.5.1-.2.9-.2 1.2-.2.3 0 .6 0 .8.4.2.3.7 1.1.6 1.3z"/></svg>
    </a>
  </div>
  <div class="fine">© COMANCHERO · Maputo</div>
</footer>

<script>
/* ---- HOURS (edit here: 0=Sun … 6=Sat, [open, close] in 24h Maputo time) ---- */
const HOURS = {0:[10,23],1:[10,23],2:[10,23],3:[10,23],4:[10,23],5:[10,23],6:[10,23]};

const I18N = {
  pt:{open:'Aberto agora', closed:'Fechado agora', menu:'Ver Menu', wa:'WhatsApp', followIg:'Siga-nos no Instagram', followFb:'Facebook',
      visit:'Visite-nos', hours:'Horário', order:'Pedidos', orderSub:'Peça pelo WhatsApp ou no balcão'},
  en:{open:'Open now', closed:'Closed now', menu:'View Menu', wa:'WhatsApp', followIg:'Follow us on Instagram', followFb:'Facebook',
      visit:'Visit us', hours:'Hours', order:'Orders', orderSub:'Order on WhatsApp or at the counter'}
};
let LANG = localStorage.getItem('cmx_lang');
if(!LANG){
  const nl = (navigator.language || navigator.userLanguage || 'pt').toLowerCase();
  LANG = nl.startsWith('pt') ? 'pt' : 'en';
}

function fmtH(h){ return String(h).padStart(2,'0') + ':00'; }
function updateOpen(){
  const now = new Date(new Date().toLocaleString('en-US',{timeZone:'Africa/Maputo'}));
  const [o,c] = HOURS[now.getDay()];
  const hr = now.getHours();
  const isOpen = hr >= o && hr < c;
  const pill = document.getElementById('open-pill');
  const t = I18N[LANG];
  pill.classList.toggle('closed', !isOpen);
  document.getElementById('open-label').textContent = isOpen ? t.open : t.closed;
  document.getElementById('hours').textContent = fmtH(o) + ' – ' + fmtH(c);
}
function applyLang(){
  const t = I18N[LANG];
  document.getElementById('cta-menu').innerHTML = t.menu + ' <span class="arrow">→</span>';
  document.getElementById('cta-wa').textContent = t.wa;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    el.textContent = t[el.dataset.i18n] || el.textContent;
  });
  document.documentElement.lang = LANG;
  updateOpen();
}
/* language auto-detect: PT default, EN if browser is English-only */
applyLang();
setInterval(updateOpen, 60000);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COMANCHERO — American Fastfood Restaurant & Grill House</title>
<meta name="description" content="COMANCHERO menu — burgers, sandwiches, platters, pizza, grills and drinks. Rua Ngungunhane.">
<meta property="og:title" content="COMANCHERO">
<meta property="og:description" content="American Fastfood Restaurant & Grill House">
<meta property="og:image" content="img/hero.jpg">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%23E63952'/><text x='50' y='72' font-size='62' font-family='Arial Black,Arial' font-weight='900' fill='white' text-anchor='middle'>C</text></svg>">
<style>
  :root{
    --red:#E63952;
    --bg:#0b0b0b;
    --card:#161616;
    --card2:#1e1e1e;
    --text:#f5f5f5;
    --muted:#9a9a9a;
    --border:#2a2a2a;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;line-height:1.5}
  img{display:block;max-width:100%}

  /* HERO */
  .hero{position:relative;min-height:88vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.55)),url('img/hero.jpg') center/cover no-repeat}
  .hero-card{background:rgba(255,255,255,.94);border-radius:28px;padding:48px 40px;max-width:620px;width:100%;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.55)}
  .hero-card h1{font-size:clamp(2.4rem,7vw,4.4rem);font-weight:900;letter-spacing:.04em;color:var(--red);font-family:'Arial Black',Arial,sans-serif}
  .hero-card p{margin-top:10px;font-size:1.02rem;font-weight:600;color:#111}
  .btn{display:inline-block;margin-top:26px;background:var(--red);color:#fff;font-weight:800;letter-spacing:.12em;padding:15px 52px;border-radius:999px;font-size:1rem;border:none;cursor:pointer;text-decoration:none;transition:transform .15s,box-shadow .15s}
  .btn:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(230,57,82,.45)}
  .scroll-hint{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);color:#fff;opacity:.85;font-size:.8rem;letter-spacing:.2em;animation:bob 1.6s infinite ease-in-out}
  @keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,8px)}}

  /* NAV */
  .navbar{position:sticky;top:0;z-index:50;background:rgba(11,11,11,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
  .navbar-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:12px 18px}
  .navbar .logo{color:#fff;font-weight:900;letter-spacing:.05em;font-family:'Arial Black',Arial,sans-serif;text-decoration:none;font-size:1.15rem}
  .navbar .logo span{color:var(--red)}
  .tabs{display:flex;gap:2px;overflow-x:auto;padding:14px 12px;max-width:1100px;margin:0 auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;background:none;border:1px solid var(--border);color:var(--muted);font-weight:700;font-size:.86rem;padding:9px 18px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:all .15s}
  .tab:hover{border-color:var(--red);color:#fff}
  .tab.active{background:var(--red);border-color:var(--red);color:#fff}

  /* MENU */
  .menu-wrap{max-width:1100px;margin:0 auto;padding:34px 18px 60px}
  .menu-head{text-align:center;margin-bottom:8px}
  .menu-head h2{font-size:clamp(1.8rem,5vw,2.6rem);font-weight:900;color:var(--red);font-family:'Arial Black',Arial,sans-serif}
  .section-title{margin:34px 0 16px;font-size:1.15rem;font-weight:800;color:#fff;letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--border);padding-bottom:10px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}
  .item{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;transition:transform .15s,border-color .15s}
  .item:hover{transform:translateY(-3px);border-color:#3a3a3a}
  .item .ph{aspect-ratio:4/3;overflow:hidden;background:var(--card2)}
  .item .ph img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
  .item:hover .ph img{transform:scale(1.04)}
  .item .body{padding:16px 18px 18px}
  .item .row{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
  .item h3{font-size:1.02rem;font-weight:800;letter-spacing:.02em}
  .item .price{color:var(--red);font-weight:900;font-size:1.05rem;white-space:nowrap}
  .item .price small{font-size:.72em;font-weight:700;opacity:.75}
  .item .desc{margin-top:8px;color:var(--muted);font-size:.86rem;line-height:1.45}
  .noimg{display:flex;align-items:center;justify-content:center;background:var(--card2);color:#444;font-weight:900;font-size:2rem;height:100%}

  .menu-panel{display:none}
  .menu-panel.active{display:block}

  /* FOOTER */
  footer{border-top:1px solid var(--border);padding:28px 18px;text-align:center;color:var(--muted);font-size:.85rem}
  footer b{color:#fff}
  footer .social{margin-top:8px}
  footer a{color:var(--red);text-decoration:none;font-weight:700}

  /* ORDER BANNER */
  .order-strip{background:var(--red);color:#fff;text-align:center;font-weight:800;letter-spacing:.05em;padding:14px;font-size:.95rem}
  @media(max-width:560px){
    .hero{min-height:74vh}
    .hero-card{padding:34px 22px;border-radius:22px}
    .grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<section class="hero">
  <div class="hero-card">
    <h1>COMANCHERO</h1>
    <p>American Fastfood Restaurant &amp; Grill House</p>
    <a class="btn" href="#menu">MENU</a>
  </div>
  <div class="scroll-hint">▼</div>
</section>

<div class="navbar">
  <div class="navbar-inner">
    <a class="logo" href="#top">COMAN<span>CHERO</span></a>
    <span id="loc" style="color:var(--muted);font-size:.85rem;font-weight:600"></span>
  </div>
</div>

<section id="menu">
  <div class="tabs" id="tabs"></div>
  <div class="menu-wrap" id="panels"></div>
</section>

<div class="order-strip">📍 Rua Ngungunhane — visit us or order in person!</div>

<footer>
  <b>COMANCHERO</b> — American Fastfood Restaurant &amp; Grill House<br>
  <div class="social">comancherooo.com</div>
</footer>

<script>
fetch('data.json?v=' + Date.now()).then(r=>r.json()).then(DATA=>{
  document.querySelector('.hero').style.background = "linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.55)), url('img/hero.jpg?v=" + Date.now() + "') center/cover no-repeat";
  document.getElementById('loc').textContent = '📍 ' + DATA.location;
  const tabs = document.getElementById('tabs');
  const panels = document.getElementById('panels');

  DATA.menus.forEach((menu, mi)=>{
    const t = document.createElement('button');
    t.className = 'tab' + (mi===0?' active':'');
    t.textContent = menu.name;
    t.onclick = ()=>{
      document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      document.querySelectorAll('.menu-panel').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      document.getElementById('p-'+menu.slug).classList.add('active');
    };
    tabs.appendChild(t);

    const p = document.createElement('div');
    p.className = 'menu-panel' + (mi===0?' active':'');
    p.id = 'p-'+menu.slug;
    let html = `<div class="menu-head"><h2>${menu.name.toUpperCase()}</h2></div>`;
    menu.sections.forEach(sec=>{
      html += `<h3 class="section-title">${sec.name}</h3><div class="grid">`;
      sec.items.forEach(it=>{
        const img = it.img ? `<img src="${it.img}" alt="${it.name}" loading="lazy">` : `<div class="noimg">C</div>`;
        const price = it.price ? `<span class="price"><small>MT</small>${it.price}</span>` : '';
        const desc = it.desc ? `<p class="desc">${it.desc}</p>` : '';
        html += `<article class="item">
          <div class="ph">${img}</div>
          <div class="body">
            <div class="row"><h3>${it.name}</h3>${price}</div>
            ${desc}
          </div>
        </article>`;
      });
      html += `</div>`;
    });
    p.innerHTML = html;
    panels.appendChild(p);
  });
});
</script>
</body>
</html>

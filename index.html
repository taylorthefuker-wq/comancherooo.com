<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COMANCHERO — American Fastfood Restaurant & Grill House</title>
<meta name="description" content="COMANCHERO menu — burgers, sandwiches, platters, pizza, grills and drinks. Maputo.">
<meta property="og:title" content="COMANCHERO">
<meta property="og:description" content="American Fastfood Restaurant & Grill House">
<meta property="og:image" content="img/hero.jpg">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%23E63952'/><text x='50' y='72' font-size='62' font-family='Arial Black,Arial' font-weight='900' fill='white' text-anchor='middle'>C</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#E63952;
    --red-deep:#b32236;
    --gold:#c9a96a;
    --gold-dim:#8a7448;
    --bg:#0b0a08;
    --card:#151310;
    --card2:#1d1915;
    --text:#f2efe9;
    --muted:#a49c8e;
    --border:#2a2620;
    --serif:'Playfair Display',Georgia,serif;
    --sans:'Manrope','Segoe UI',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
  img{display:block;max-width:100%}

  /* ---------- HERO ---------- */
  .hero{position:relative;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:linear-gradient(rgba(8,6,4,.55),rgba(11,10,8,.82)),url('img/hero.jpg') center/cover no-repeat}
  .hero-inner{text-align:center;max-width:860px;padding:20px}
  .kicker{color:var(--gold);letter-spacing:.42em;font-size:.72rem;font-weight:800;text-transform:uppercase}
  .hero h1{font-family:var(--serif);font-weight:800;font-size:clamp(3rem,10vw,6.8rem);letter-spacing:.02em;line-height:1.05;margin-top:18px;text-shadow:0 8px 40px rgba(0,0,0,.6)}
  .hero h1 span{color:var(--red)}
  .ornament{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:22px;color:var(--gold)}
  .ornament::before,.ornament::after{content:"";height:1px;width:clamp(40px,12vw,120px);background:linear-gradient(90deg,transparent,var(--gold));}
  .ornament::after{background:linear-gradient(90deg,var(--gold),transparent)}
  .hero p{margin-top:20px;font-size:clamp(.95rem,2.4vw,1.15rem);color:#e8e2d6;font-weight:600}
  .hero .loc{margin-top:10px;color:var(--gold);font-size:.82rem;letter-spacing:.18em;font-weight:600}
  .btn{display:inline-block;margin-top:30px;background:var(--red);color:#fff;font-family:var(--sans);font-weight:800;letter-spacing:.22em;padding:16px 46px;border-radius:2px;font-size:.82rem;border:none;cursor:pointer;text-decoration:none;text-transform:uppercase;transition:transform .18s,box-shadow .18s,background .18s}
  .btn:hover{transform:translateY(-2px);background:var(--red-deep);box-shadow:0 16px 40px rgba(230,57,82,.35)}
  .scroll-hint{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);color:var(--gold);opacity:.85;font-size:.66rem;letter-spacing:.34em;font-weight:600;animation:bob 1.8s infinite ease-in-out}
  @keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,9px)}}

  /* ---------- NAV ---------- */
  .navbar{position:sticky;top:0;z-index:50;background:rgba(11,10,8,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
  .navbar-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:14px 18px}
  .navbar .logo{color:var(--text);font-family:var(--serif);font-weight:800;font-size:1.2rem;letter-spacing:.06em;text-decoration:none}
  .navbar .logo span{color:var(--red)}
  .navbar .loc{color:var(--gold);font-size:.78rem;letter-spacing:.14em;font-weight:600}
  .tabs{display:flex;gap:4px;overflow-x:auto;padding:0 12px 14px;max-width:1100px;margin:0 auto;scrollbar-width:none;border-top:1px solid rgba(201,169,106,.12)}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-family:var(--sans);font-weight:600;font-size:.82rem;letter-spacing:.06em;padding:9px 15px;cursor:pointer;white-space:nowrap;transition:color .15s,border-color .15s}
  .tab:hover{color:var(--gold)}
  .tab.active{color:var(--text);border-bottom-color:var(--red)}

  /* ---------- MENU ---------- */
  .menu-wrap{max-width:1100px;margin:0 auto;padding:48px 18px 70px}
  .menu-head{text-align:center;margin-bottom:10px}
  .menu-head .small{color:var(--gold);letter-spacing:.4em;font-size:.68rem;font-weight:800;text-transform:uppercase}
  .menu-head h2{font-family:var(--serif);font-size:clamp(2rem,6vw,3.2rem);font-weight:800;margin-top:10px}
  .section-title{display:flex;align-items:center;gap:18px;margin:46px 0 20px;color:var(--gold);font-size:.78rem;letter-spacing:.3em;font-weight:800;text-transform:uppercase;white-space:nowrap}
  .section-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold-dim),transparent)}
  .section-title span{font-family:var(--serif);font-style:italic;font-weight:600;font-size:1.1rem;letter-spacing:.04em;text-transform:none;color:var(--gold)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px}
  .item{background:var(--card);border:1px solid var(--border);border-radius:6px;overflow:hidden;transition:transform .2s,border-color .2s,box-shadow .2s}
  .item:hover{transform:translateY(-4px);border-color:var(--gold-dim);box-shadow:0 18px 44px rgba(0,0,0,.5)}
  .item .ph{aspect-ratio:4/3;overflow:hidden;background:var(--card2)}
  .item .ph img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
  .item:hover .ph img{transform:scale(1.06)}
  .item .body{padding:18px 20px 20px}
  .item .row{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
  .item h3{font-family:var(--serif);font-size:1.12rem;font-weight:800;letter-spacing:.01em}
  .item .price{color:var(--red);font-weight:800;font-size:1.02rem;white-space:nowrap}
  .item .price small{font-size:.68em;font-weight:800;color:var(--gold);letter-spacing:.08em;margin-right:2px}
  .item .desc{margin-top:9px;color:var(--muted);font-size:.85rem;line-height:1.5}
  .noimg{display:flex;align-items:center;justify-content:center;background:var(--card2);color:#4a433a;font-family:var(--serif);font-weight:800;font-size:2.2rem;height:100%}

  .menu-panel{display:none}
  .menu-panel.active{display:block}
  .empty-note{text-align:center;color:var(--muted);font-family:var(--serif);font-style:italic;font-size:1.05rem;padding:50px 10px}

  /* reveal animation */
  .reveal{opacity:0;transform:translateY(16px);transition:opacity .55s ease,transform .55s ease}
  .reveal.in{opacity:1;transform:none}

  /* ---------- STRIP & FOOTER ---------- */
  .order-strip{background:linear-gradient(120deg,var(--red-deep),var(--red));color:#fff;text-align:center;font-weight:600;letter-spacing:.06em;padding:18px;font-size:.92rem}
  footer{border-top:1px solid var(--border);padding:36px 18px;text-align:center;color:var(--muted);font-size:.85rem}
  footer .wm{font-family:var(--serif);font-weight:800;font-size:1.3rem;color:var(--text);letter-spacing:.06em}
  footer .wm span{color:var(--red)}
  footer .hair{width:70px;height:1px;background:var(--gold);margin:16px auto}
  footer .social{margin-top:8px}
  footer a{color:var(--gold);text-decoration:none;font-weight:700;letter-spacing:.06em}
  footer .loc-f{color:var(--muted)}

  @media(max-width:560px){
    .grid{grid-template-columns:1fr}
    .navbar .loc{display:none}
    .menu-wrap{padding-top:34px}
  }
</style>
</head>
<body>

<section class="hero">
  <div class="hero-inner">
    <div class="kicker">American Fastfood · Restaurant &amp; Grill House</div>
    <h1>COMAN<span>CHERO</span></h1>
    <div class="ornament">✦</div>
    <p>Big flavours. Open flame. Pure Americana in the heart of Maputo.</p>
    <div class="loc" id="hero-loc"></div>
    <a class="btn" href="#menu">Explore the Menu</a>
  </div>
  <div class="scroll-hint">SCROLL</div>
</section>

<header class="navbar">
  <div class="navbar-inner">
    <a class="logo" href="#top">COMAN<span>CHERO</span></a>
    <span class="loc" id="loc"></span>
  </div>
  <div class="tabs" id="tabs"></div>
</header>

<section id="menu">
  <div class="menu-wrap" id="panels"></div>
</section>

<div class="order-strip" id="strip">📍 Visit us or order in person!</div>

<footer>
  <div class="wm">COMAN<span>CHERO</span></div>
  <div class="hair"></div>
  American Fastfood Restaurant &amp; Grill House<br>
  <span class="loc-f" id="loc-f"></span>
  <div class="social">comancherooo.com</div>
</footer>

<script>
fetch('data.json?v=' + Date.now()).then(r=>r.json()).then(DATA=>{
  document.querySelector('.hero').style.background = "linear-gradient(rgba(8,6,4,.55),rgba(11,10,8,.82)), url('img/hero.jpg?v=" + Date.now() + "') center/cover no-repeat";
  document.getElementById('loc').textContent = '📍 ' + DATA.location;
  document.getElementById('loc-f').textContent = DATA.location;
  document.getElementById('hero-loc').textContent = '— ' + DATA.location.toUpperCase() + ' —';
  document.getElementById('strip').textContent = '📍 ' + DATA.location + ' — visit us or order in person!';
  const tabs = document.getElementById('tabs');
  const panels = document.getElementById('panels');

  const fmtPrice = p => String(p||'').replace(/\.00$/,'');

  DATA.menus.forEach((menu, mi)=>{
    const t = document.createElement('button');
    t.className = 'tab' + (mi===0?' active':'');
    t.textContent = menu.name;
    t.onclick = ()=>{
      document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      document.querySelectorAll('.menu-panel').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      document.getElementById('p-'+menu.slug).classList.add('active');
      requestAnimationFrame(observePanels);
    };
    tabs.appendChild(t);

    const p = document.createElement('div');
    p.className = 'menu-panel' + (mi===0?' active':'');
    p.id = 'p-'+menu.slug;
    let html = `<div class="menu-head reveal"><div class="small">The Menu</div><h2>${menu.name.toUpperCase()}</h2></div>`;
    if(!menu.sections.length){
      html += `<div class="empty-note">Coming soon…</div>`;
    }
    menu.sections.forEach(sec=>{
      html += `<h3 class="section-title reveal"><span>${sec.name}</span></h3><div class="grid">`;
      sec.items.forEach(it=>{
        const img = it.img ? `<img src="${it.img}" alt="${it.name}" loading="lazy">` : `<div class="noimg">C</div>`;
        const price = it.price ? `<span class="price"><small>MT</small>${fmtPrice(it.price)}</span>` : '';
        const desc = it.desc ? `<p class="desc">${it.desc}</p>` : '';
        html += `<article class="item reveal">
          <div class="ph">${img}</div>
          <div class="body">
            <div class="row"><h3>${it.name}</h3>${price}</div>
            ${desc}
          </div>
        </article>`;
      });
      html += `</div>`;
    });
    p.innerHTML = html;
    panels.appendChild(p);
  });

  const io = new IntersectionObserver(es=>{
    es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
  },{threshold:.08});
  function observePanels(){
    document.querySelectorAll('.menu-panel.active .reveal:not(.in)').forEach(el=>io.observe(el));
  }
  observePanels();
});
</script>
</body>
</html>
